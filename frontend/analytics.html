
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Analytics</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">

        
<header class="page-header">
    <h1>Expense Analytics</h1>
    <p>Understand your spending and income.</p>

    <nav class="page-navigation">
        <a href="/" class="nav-btn dashboard-btn">
            <span>←</span> Back to Dashboard
        </a>
    </nav>
</header>


        <section class="summary">
            <div class="summary-card income-card">
                <h3>Total Income</h3>
                <p id="analyticsIncome">₹0.00</p>
            </div>

            <div class="summary-card expense-card">
                <h3>Total Expenses</h3>
                <p id="analyticsExpenses">₹0.00</p>
            </div>

            <div class="summary-card balance-card">
                <h3>Balance</h3>
                <p id="analyticsBalance">₹0.00</p>
            </div>
        </section>

        <section class="panel">
            <h2>Monthly Income vs Expenses</h2>
            <div style="position:relative; height:350px;">
                <canvas id="monthlyChart"></canvas>
            </div>
        </section>

        <section class="panel">
            <h2>Expenses by Category</h2>
            <div style="position:relative; height:350px;">
                <canvas id="categoryChart"></canvas>
            </div>
        </section>

        <p id="analyticsMessage" role="status" aria-live="polite"></p>

        <footer>
            <p>Personal Expense Tracker · Analytics</p>
        </footer>

    </div>

    <script src="analytics.js"></script>
</body>
</html>
